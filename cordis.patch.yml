# dsh-se-skills bundle patch — dual-track registration for the dsh web profile.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field);
# activate with `dsh plugin --profile web add link:D:/tags/se-skills`.
#
# Field shapes here are taken from the shipped schemas, not invented:
#   - dsh-skill-filesystem: providerName / includeDefaultRoots / customSkillDirs
#   - dsh-mcp-client (stdio): transport / serverName / command / args / env /
#     cwd / toolCallTimeoutMs / failOnStartupError
# Unknown config keys are rejected at activation, so do not add free-form
# fields such as `description` — document intent in comments instead.
#
# Track 1 — skills provider: a bare `@deepseek-ai/dsh-skill-filesystem` provider
# with a distinct providerName and `includeDefaultRoots: false`, so it contributes
# ONLY this package's `skills/` directory (16 SE workflow skills) and nothing
# else — not the project's `.dsh/skills`, not the user's `~/.dsh/skills`. It
# registers into the host plane's global skill layer, so every agent on every
# preset sees the merged catalog. `baseUrl` inside the !!js expression is the
# profile directory (~/.dsh/profiles/web), so the path resolves through the
# profile's node_modules symlink straight back into this package — skills are
# served in place, no copies, and edits under `skills/` are live.
#
# Track 2 — plugin: the dsh-se-skills plugin (lib/index.js) registers the 6
# `/se-*` entry skills from `commands/` (user-facing only — they never enter the
# model's skill catalog) and the 5 review personas from `agents/` (both surfaces).
# Edits under `commands/`, `agents/`, and `lib/` need a dsh service restart.
#
# Track 3 — MCP servers: every row spawns the SAME node that runs dsh
# (`process.execPath`) on `mcp/shim.mjs`, passing only a server id. The shim
# reads `mcp/servers.json` and prefers a local copy under `.mcp-vendor/` (filled
# by `node scripts/fetch-mcp.mjs`) over the npx/uvx fallback, so an installed
# profile keeps working with no network. Pins live in servers.json, not here —
# one record, read by both the shim and the fetcher. A row may pin a released
# version (drawio, math, kicad) or a commit sha (regmap, whose upstream publishes
# nowhere but GitHub); the shim does not care, because both launch as
# `node <entry>` or a venv console script.
#
# Why a shim instead of an inline !!js ternary: the existence test would have to
# be repeated for `command` and every `args` entry, on every row, and a failed
# spawn reports nothing but "spawn failed". The shim is one testable place, and
# `node mcp/shim.mjs --list` prints what each row would actually launch.
#
# `failOnStartupError: false` means a missing npx / uvx / python disables that
# one server instead of failing activation, so delete any row you do not want
# rather than expecting the host to stay up.
- insert:
    - id: se-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: se-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/skills/', baseUrl))"
- insert:
    - id: dsh-se-skills
      name: 'dsh-se-skills'
- insert:
    # draw.io diagram generation (official jgraph MCP). Windows: if the child
    # fails to spawn, change `npx` to `npx.cmd`.
    - id: mcp-drawio
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: drawio
        transport: stdio
        command: !!js "process.execPath"
        args:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/mcp/shim.mjs', baseUrl))"
          - drawio
        failOnStartupError: false
    # Visio .vsdx generation for formal documentation. Disabled by default: the
    # upstream (visio-mcp on PyPI) needs Python >=3.14 AND a licensed Microsoft
    # Visio install driven over COM, neither of which can be assumed here. On a
    # machine that has both, set `disabled: false`. Notably this row is the one
    # that is NOT vendored — see mcp/servers.json for why.
    - id: mcp-visio
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: visio
        transport: stdio
        command: !!js "process.execPath"
        args:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/mcp/shim.mjs', baseUrl))"
          - visio
        failOnStartupError: false
    # Engineering calculator: SNR, power budget, thermal, timing, baud-rate error.
    - id: mcp-math
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: math
        transport: stdio
        command: !!js "process.execPath"
        args:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/mcp/shim.mjs', baseUrl))"
          - math
        # No `env` pinning needed here: for a vendored Python server the shim
        # runs that environment's own interpreter, so the version is pinned by
        # the venv rather than by this row. `SE_SKILLS_PYTHON` is only consulted
        # by scripts/fetch-mcp.mjs, which decides which python builds the venv.
        failOnStartupError: false
    # Register-map lookup from ARM CMSIS-SVD files (upstream mcp-svd). Grounds
    # register names, bit positions and addresses in the vendor's own SVD instead
    # of in the model's recollection of the chip. Every call takes an explicit
    # `svd_file` path — there is no implicit default — and the vendored copy ships
    # STM32F411 / nRF52840 / rp2040 under `.mcp-vendor/regmap/node_modules/mcp-svd/svd/`;
    # point it at your own chip's SVD for anything else.
    - id: mcp-regmap
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: regmap
        transport: stdio
        command: !!js "process.execPath"
        args:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/mcp/shim.mjs', baseUrl))"
          - regmap
        failOnStartupError: false
    # KiCad schematic read/write (the `schematic` sub-server of mcp-server-kicad,
    # 42 tools, NOT the 109-tool unified entry — a smaller tool surface costs less
    # context and earns its place more easily). Disabled by default: it operates on
    # `.kicad_sch` files, which a project only has once a board is actually being
    # drawn. Note what this row is NOT: it contains no pin-conflict or
    # pin-assignment validator, so it does not cover arch-stage pin planning.
    # KiCad 9.x/10.x is needed only for ERC, DRC and the export tools; the other 38
    # parse the schematic directly.
    - id: mcp-kicad
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: kicad
        transport: stdio
        command: !!js "process.execPath"
        args:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-se-skills/mcp/shim.mjs', baseUrl))"
          - kicad
        failOnStartupError: false
